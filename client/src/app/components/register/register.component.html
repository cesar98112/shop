<div class="loginContainer">
    
    <div class="backgroundFilter">
        <img class="logo" src="assets/logo.png" alt="">
        <div class="containerForm">
                
                
                <div class="titleLogin">
                      
                </div>
                <form class="formulario" action="">
                    <h1>INTRODUCE TUS DATOS</h1>
                    <div class="inputLogin">
                        <label for="username">Username</label>
                        <input type="text" id="username" [(ngModel)]="username"  name="username" placeholder="username">
                    </div>

                    <div class="fullName">
                        <div class="inputLogin">
                            <label for="Name">Nombre</label>
                            <input type="text" id="Name" [(ngModel)]="name"  name="name" placeholder="Name">
                        </div>
                        <div class="inputLogin">
                            <label for="LastName">Apellidos</label>
                            <input type="text" id="LastName" [(ngModel)]="lastName" name="lastName" placeholder="lastName">
                        </div>
                    </div>
                    
                    <div class="inputLogin">
                        <label for="Email">Email</label>
                        <input type="email" id="Email" [(ngModel)]="email" name="email" placeholder="email">
                    </div>
                    <div class="passwordInput">
                        <div class="inputLogin">
                            <label for="password">Password</label>
                            <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="password">
                        </div>
                        <div class="inputLogin">
                            <label for="passwordRepeat">Repetir contraseña</label>
                            <input type="password" id="passwordRepeat" [(ngModel)]="passwordRepeat" name="passwordRepeat" placeholder="passwordRepeat">
                        </div>
                    </div>
                    
                    
                    <div class="buttonContainer">
                        <button class="buttonLogin" (click)="register()">Registrarse</button>
                        <p>¿Ya tienes cuenta? <a href="/">Logeate</a></p>
                    </div>
                    
                </form>
        </div>
    </div>
    
    
</div>
